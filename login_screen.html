<!DOCTYPE html>
<html>
<head>
    <title>CurrencyCare_LogIn</title>
    <link rel="stylesheet" href="login_screen_style.css">
    <script src="login_screen_script.js" defer></script>
</head>

<body>
<div class="main-box" id="mainBox">
    <div>
        <h1>Log In</h1>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <br/>
            <br/>
            <input type="password" id="password" placeholder="Password" required>
            <br/>
            <br/>
            <button type="submit">Log In</button>
        </form>
        <br/>
        <h3>Don't have an account?</h3>
        <a>
            <button onclick="window.location.href='singin_screen.html'">Log In</button>
        </a>
    </div>
</div>

</body>

</html>
